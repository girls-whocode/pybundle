name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install build tooling
        run: python -m pip install --upgrade build

      - name: Assert tag matches pyproject version
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"          # e.g. v2.1.0
          VER="${TAG#v}"                    # 2.1.0
          PYPROJECT_VER="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          echo "Tag version:      $VER"
          echo "pyproject.toml:   $PYPROJECT_VER"
          test "$VER" = "$PYPROJECT_VER" || { echo "ERROR: Tag/version mismatch"; exit 1; }

      - name: Build sdist and wheel
        run: python -m build

      - name: Assert artifacts match version
        shell: bash
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME#v}"
          ls -lah dist/
          ls dist/ | grep -F "$VER" >/dev/null || { echo "ERROR: dist/ artifacts do not include version $VER"; exit 1; }

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
