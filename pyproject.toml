[project.scripts]
pybundle = "pybundle.cli:main"

[project]
name = "gwc-pybundle"
description = "Deterministic Python project context bundling for humans, automation, and AI"
readme = "README.md"
license = { file = "LICENSE.md" }
version = "2.2.0"
requires-python = ">=3.9"

dependencies = [
  "colorama>=0.4.6",
  "iniconfig>=2.3.0",
  "librt>=0.7.5",
  "packaging>=25.0",
  "pathspec>=0.12.1",
  "pluggy>=1.6.0",
  "Pygments>=2.19.2",
  "typing_extensions>=4.15.0",
  "pdoc>=16.0.0",
]

authors = [
  { name = "Jessica Brown", email = "jessica@codenamejessica.com" }
]

classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Build Tools",
  "Topic :: Software Development :: Debuggers",
  "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/girls-whocode/pybundle"
Repository = "https://github.com/girls-whocode/pybundle"
Issues = "https://github.com/girls-whocode/pybundle/issues"

[tool.setuptools.packages.find]
include = ["pybundle*"]
exclude = ["artifacts*", ".pybundle*"]

[tool.setuptools]
include-package-data = false

[project.optional-dependencies]
# Analysis tools used by pybundle steps (install for full functionality)
tools = [
  "pytest>=9.0.2",
  "mypy>=1.19.1",
  "mypy_extensions>=1.2.1",
  "ruff>=0.14.10",
  "pylint",
  "pip-licenses",
  "line_profiler",
  "pipdeptree",
  "vulture",
  "radon",
  "interrogate",
  "bandit",
  "pip-audit",
]

# Development dependencies for working on pybundle itself
dev = [
  "build",
  "twine",
]

# Install everything (tools + dev)
all = [
  "pytest>=9.0.2",
  "mypy>=1.19.1",
  "mypy_extensions>=1.2.1",
  "ruff>=0.14.10",
  "pylint",
  "pip-licenses",
  "line_profiler",
  "pipdeptree",
  "vulture",
  "radon",
  "interrogate",
  "bandit",
  "pip-audit",
  "build",
  "twine",
]